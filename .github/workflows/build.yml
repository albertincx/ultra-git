name: Build ultra Git

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.1)'
        required: false
        default: ''

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Resolve Version Name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VER="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
            VER="v${PKG_VER}-${SHORT_SHA}"
          fi
          echo "APP_VERSION=${VER}" >> $GITHUB_ENV
          echo "Resolved version: ${VER}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck and Build Web Client
        run: pnpm run build

      - name: Compile macOS Swift Native Binary
        run: |
          swiftc -O macos/main.swift -o macos/ultraGit
          chmod +x macos/ultraGit

      - name: Package Application Archive with Version Name
        run: |
          DIST_ZIP="ultra-git-${APP_VERSION}-macos.zip"
          mkdir -p build_output/macos
          cp macos/ultraGit build_output/macos/
          cp macos/AppIcon.icns build_output/macos/
          cp macos/AppIcon.png build_output/macos/

          # Package native macOS .app bundle
          APP_BUNDLE="build_output/ultra Git.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp macos/ultraGit "${APP_BUNDLE}/Contents/MacOS/"
          cp macos/AppIcon.icns "${APP_BUNDLE}/Contents/Resources/"
          cp macos/Info.plist "${APP_BUNDLE}/Contents/"

          cp -r dist build_output/
          cp -r server build_output/
          cp package.json build_output/
          
          cd build_output
          zip -r "../${DIST_ZIP}" .
          cd ..
          
          echo "DIST_ZIP=${DIST_ZIP}" >> $GITHUB_ENV
          ls -la "${DIST_ZIP}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultra-git-${{ env.APP_VERSION }}-macos
          path: ${{ env.DIST_ZIP }}

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: ultra Git ${{ env.APP_VERSION }}
          files: ${{ env.DIST_ZIP }}
          draft: false
          prerelease: false
          generate_release_notes: true

